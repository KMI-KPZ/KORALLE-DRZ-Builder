# nginx configuration template for the frontend image.
# The nginx image fills in ${…} from environment variables at start (envsubst), see Dockerfile:
#   API_UPSTREAM            backend for /api/ (default http://sim:8000, the simulation dev server in docker-compose)
#   NGINX_LOCAL_RESOLVERS   DNS server(s) from /etc/resolv.conf (Docker and Podman), set by the image entrypoint
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Backend API (simulation engine now, the Django backend later), same origin so no CORS is needed.
    # The upstream is resolved per request: the app starts even if the API container is not running
    # (requests to /api/ then answer 502 and the app shows "Simulationsdienst nicht erreichbar").
    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }
}
